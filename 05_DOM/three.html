<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul class="language">
        <li>javaScript</li>
    </ul>
</body>
<script>
    function addLanguage(language)
    {
        const ul=document.getElementsByClassName("language")[0];
        const li=document.createElement("li");
        li.innerHTML=`${language}`//because of this it will treverse whole tree again and again
        ul.appendChild(li)
    }
    addLanguage("java");
    addLanguage("python");
    function addOptiLanguage(langName)
    {
        const li=document.createElement('li');
        li.appendChild(document.createTextNode(langName));
        const ul=document.querySelector('.language').appendChild(li)
    }
    addOptiLanguage('golang')

    //edit
    const secondLang=document.querySelector("li:nth-child(2)");
    const newLi=document.createElement('li');
    newLi.textContent="rudy";
    secondLang.replaceWith(newLi)

    //edit
    const firstLang=document.querySelector('li:first-child')
    firstLang.outerHTML='<li>Typescript</li>'

//remove
  const lastLang=document.querySelector("li:last-child");
  lastLang.remove();
</script>
</html>
